<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Countdown</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Event Countdown</h1>
      <p>Track the time remaining until your important events.</p>
    </header>

    <section class="add-event">
      <h2 id="form-title">Add New Event</h2>
      <form id="event-form">
        <div class="form-group">
          <label for="event-name">Event Name</label>
          <input type="text" id="event-name" required placeholder="e.g. Birthday Party">
        </div>
        <div class="form-group">
          <label for="event-date">Date</label>
          <input type="date" id="event-date" required>
        </div>
        <div class="form-group">
          <label for="event-time">Time (optional)</label>
          <input type="time" id="event-time">
        </div>
        <div class="form-group">
          <label for="event-unit">Countdown Display</label>
          <select id="event-unit">
            <option value="default">Default</option>
            <option value="years">Years</option>
            <option value="months">Months</option>
            <option value="days">Days</option>
            <option value="hours">Hours</option>
            <option value="minutes">Minutes</option>
            <option value="seconds">Seconds</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="submit" id="submit-btn">Add Event</button>
          <button type="button" id="cancel-btn" class="cancel-btn" style="display: none;">Cancel</button>
        </div>
      </form>
    </section>

    <section class="events-list">
      <h2>Your Events</h2>
      <div id="events-container">
        <!-- Events will be rendered here -->
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
